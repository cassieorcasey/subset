<style>
:root {
  /* Alabaster & Deep Plum. Permukaan terang, Royal Velvet untuk merek/progres, Obsidian Plum untuk aksi dan angka. */
  --bg: #FAF9FC;
  --card: #FFFFFF;
  --text: #241934;
  --text2: #5C546B;
  --text-muted: #8E859E;
  --line: #E8E3F0;
  --fill: #EFEAF8;
  --fill-strong: #E3DBF2;
  --accent: #5E4396;
  --accent-hover: #4E3880;
  --on-accent: #FFFFFF;
  --link: #5E4396;
  --action: #241934;
  --action-hover: #35254D;
  --on-action: #FFFFFF;
  --lav: #C8B6E2;
  --on-c: #FFFFFF;
  --good: #2B7A5B;
  --good-bg: #EBF5F0;
  --warn: #B45309;
  --warn-bg: #FEF3C7;
  --bad: #C2413B;
  --bad-bg: #FDECEC;
  --glass: rgba(250,249,252,.74);
  --sheet: #FAF9FC;
  --sheet-card: #FFFFFF;
  --shadow: 0 1px 2px rgba(36,25,52,.05), 0 10px 30px rgba(36,25,52,.07);
  --lg-tint: rgba(255,255,255,.34);
  --lg-rim: rgba(255,255,255,.95);
  --lg-rim-soft: rgba(255,255,255,.18);
  --lg-sheen: rgba(255,255,255,.42);
  --lg-shadow: 0 12px 34px rgba(0,0,0,.13), 0 2px 6px rgba(0,0,0,.07), inset 0 0 0 .5px rgba(0,0,0,.07);
  --lens: rgba(94,67,150,.13);
  --lens-press: rgba(255,255,255,.38);
  --seg-on: #ffffff;
  --spring: cubic-bezier(.3,1.4,.5,1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --px: 16px;
  --pl: max(var(--px), var(--safe-l));
  --pr: max(var(--px), var(--safe-r));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #120E19; --card: #1D1628; --text: #F3EFFA; --text2: #B3A9C6; --text-muted: #8E859E;
    --line: rgba(200,182,226,.16); --fill: rgba(200,182,226,.12); --fill-strong: rgba(200,182,226,.22);
    --accent: #C8B6E2; --accent-hover: #D8CAEE; --on-accent: #241934; --link: #C8B6E2;
    --action: #C8B6E2; --action-hover: #D8CAEE; --on-action: #241934; --lav: #C8B6E2; --on-c: #1A1325;
    --good: #4CC38A; --good-bg: rgba(76,195,138,.14); --warn: #F0A04B; --warn-bg: rgba(240,160,75,.14); --bad: #FF8A80; --bad-bg: rgba(255,138,128,.14);
    --glass: rgba(18,14,25,.72); --sheet: #1D1628; --sheet-card: #2A2038;
    --shadow: 0 0 0 1px rgba(200,182,226,.08);
    --lg-tint: rgba(42,32,56,.42); --lg-rim: rgba(255,255,255,.42); --lg-rim-soft: rgba(255,255,255,.06);
    --lg-sheen: rgba(255,255,255,.12); --lg-shadow: 0 12px 34px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
    --lens: rgba(200,182,226,.16); --lens-press: rgba(200,182,226,.24); --seg-on: #4A3D63;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #120E19; --card: #1D1628; --text: #F3EFFA; --text2: #B3A9C6; --text-muted: #8E859E;
  --line: rgba(200,182,226,.16); --fill: rgba(200,182,226,.12); --fill-strong: rgba(200,182,226,.22);
  --accent: #C8B6E2; --accent-hover: #D8CAEE; --on-accent: #241934; --link: #C8B6E2;
  --action: #C8B6E2; --action-hover: #D8CAEE; --on-action: #241934; --lav: #C8B6E2; --on-c: #1A1325;
  --good: #4CC38A; --good-bg: rgba(76,195,138,.14); --warn: #F0A04B; --warn-bg: rgba(240,160,75,.14); --bad: #FF8A80; --bad-bg: rgba(255,138,128,.14);
  --glass: rgba(18,14,25,.72); --sheet: #1D1628; --sheet-card: #2A2038;
  --shadow: 0 0 0 1px rgba(200,182,226,.08);
  --lg-tint: rgba(42,32,56,.42); --lg-rim: rgba(255,255,255,.42); --lg-rim-soft: rgba(255,255,255,.06);
  --lg-sheen: rgba(255,255,255,.12); --lg-shadow: 0 12px 34px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
  --lens: rgba(200,182,226,.16); --lens-press: rgba(200,182,226,.24); --seg-on: #4A3D63;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 17px/1.4706 var(--font); letter-spacing: -.022em;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input { font: inherit; letter-spacing: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 6px color-mix(in srgb, var(--lav) 55%, transparent); border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Layout ---------- */
.shell { min-height: 100dvh; }
.sidebar { display: none; }
.main { max-width: 1040px; margin: 0 auto; padding: 0 var(--pr) calc(96px + var(--safe-b)) var(--pl); }

.topbar {
  position: sticky; top: 0; z-index: 20;
  padding-top: var(--safe-t);
  background: transparent; border-bottom: 1px solid transparent;
  transition: background .25s, border-color .25s;
}
.topbar.scrolled {
  background: var(--glass); border-bottom-color: var(--line);
  -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px);
}
.topbar-in { max-width: 1040px; margin: 0 auto; padding: 8px var(--pr) 8px var(--pl); min-height: 52px; display: flex; align-items: center; gap: 10px; }
.tb-lead { position: relative; min-width: 0; height: 32px; display: flex; align-items: center; }
.tb-title { position: absolute; left: 0; font-weight: 600; font-size: 17px; white-space: nowrap; opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .25s; }
.topbar.scrolled .tb-title { opacity: 1; transform: none; }
.tb-lead .brand { transition: opacity .2s; }
.topbar.scrolled .tb-lead .brand { opacity: 0; }
.grow { flex: 1; }

.pill {
  display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px;
  border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--text2); white-space: nowrap;
  background: var(--lg-tint); box-shadow: inset 0 1px 0 var(--lg-rim), inset 0 0 0 .5px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.06);
  -webkit-backdrop-filter: blur(14px) saturate(180%); backdrop-filter: blur(14px) saturate(180%);
  transition: transform .3s var(--spring);
}
.pill:active { transform: scale(.94); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--text2); display: block; }
.pill[data-s="ok"] i { background: var(--good); }
.pill[data-s="syncing"] i { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
.pill[data-s="pending"] i { background: var(--warn); }
.pill[data-s="error"] i { background: var(--bad); }
@keyframes pulse { 50% { opacity: .25; } }

.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; background: var(--action); color: var(--on-action);
  display: grid; place-items: center; transition: background .15s, transform .35s var(--spring);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(0,0,0,.12), 0 4px 14px color-mix(in srgb, var(--action) 32%, transparent);
}
.icon-btn:hover { background: var(--action-hover); }
.icon-btn:active { transform: scale(.88); }
.icon-btn[hidden] { display: none; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon-btn svg.i { width: 20px; height: 20px; stroke-width: 2.2; }

.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; letter-spacing: -.028em; }
/* Badan amplop (y 10.8–28) sejajar tinggi teks; dua sekat sedikit melampaui cap-height. */
.brand-ic { width: 24px; height: 24px; flex: none; position: relative; top: -2px; }
.brand-ic .bt { transform-box: view-box; }
.is-dark .brand-ic path { fill: var(--accent); } /* gradasi ikon dirancang untuk latar terang */
.brand-ic.bump .bt { animation: bt-bump 380ms cubic-bezier(.2,.8,.2,1); }
@keyframes bt-bump { 45% { transform: translateY(-1.5px); } }
/* Liquid Glass: kapsul kaca mengambang + lensa elastis */
.tabbar {
  --h: 64px; --pad: 5px;
  position: fixed; z-index: 30; left: 50%; bottom: calc(12px + var(--safe-b));
  width: min(calc(100% - 28px), 440px); height: var(--h); padding: var(--pad);
  transform: translateX(-50%); border-radius: 999px; isolation: isolate;
  background: var(--lg-tint); box-shadow: var(--lg-shadow);
  -webkit-backdrop-filter: blur(12px) saturate(190%) brightness(1.04);
  backdrop-filter: blur(12px) saturate(190%) brightness(1.04);
  touch-action: none; user-select: none; -webkit-user-select: none;
  transition: height .5s var(--spring), width .5s var(--spring), transform .5s var(--spring);
}
.tabbar.refract { -webkit-backdrop-filter: url(#lg-filter); backdrop-filter: url(#lg-filter); }
.tabbar::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 4;
  background: linear-gradient(140deg, var(--lg-rim), var(--lg-rim-soft) 38%, var(--lg-rim-soft) 62%, var(--lg-rim));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
.tabbar::after {
  content: ""; position: absolute; inset: 1px; border-radius: inherit; pointer-events: none; z-index: 0;
  background: linear-gradient(180deg, var(--lg-sheen), transparent 48%), radial-gradient(90% 120% at 50% 130%, var(--lg-sheen), transparent 60%);
  opacity: .9;
}
.tabbar.press { transform: translateX(-50%) scale(1.02); }
.lens {
  position: absolute; z-index: 1; top: var(--pad); bottom: var(--pad); left: var(--pad); width: 80px;
  border-radius: 999px; background: var(--lens);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.55), inset 0 -1px 1px rgba(255,255,255,.12);
  transform: translateX(var(--lx, 0px)) scale(var(--ls, 1));
  transition: transform .55s var(--spring), background .25s, box-shadow .25s;
  will-change: transform;
}
.tabbar.press .lens {
  --ls: 1.13; background: var(--lens-press);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.95), inset 0 -1px 2px rgba(255,255,255,.35), 0 6px 22px rgba(0,0,0,.16);
}
.tabbar.drag .lens { transition: transform .14s cubic-bezier(.2,.8,.3,1), background .25s, box-shadow .25s; }
.tabs { position: relative; z-index: 3; display: flex; height: 100%; }
.tab {
  flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font-size: 11px; font-weight: 600; letter-spacing: -.01em; color: var(--text); border-radius: 999px;
  transition: color .25s, transform .4s var(--spring);
}
.tab span { transition: opacity .2s, max-height .4s var(--spring); line-height: 1.3; max-height: 22px; overflow: hidden; white-space: nowrap; }
.tab[aria-current="page"], .tab.hot { color: var(--accent); }
.tabbar.drag .tab[aria-current="page"]:not(.hot) { color: var(--text); }
.tab.hot svg.i { transform: scale(1.12); }
.tab svg.i { transition: transform .4s var(--spring); }
.tabbar.mini { --h: 50px; width: min(calc(100% - 96px), 300px); }
.tabbar.mini .tab span { opacity: 0; max-height: 0; }

.main { padding-top: 6px; }
.toolbar { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.toolbar .seg { align-self: stretch; }

.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 32px 0 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 22px; font-weight: 700; letter-spacing: -.025em; }

.monthnav { display: inline-flex; align-items: center; background: var(--fill); border-radius: 999px; padding: 2px; }
.monthnav button { height: 32px; min-width: 32px; display: grid; place-items: center; border-radius: 999px; color: var(--accent); }
.monthnav button:hover { background: var(--fill); }
.monthnav .ml { padding: 0 10px; font-size: 15px; font-weight: 600; color: var(--text); min-width: 124px; text-align: center; }
.monthnav svg.i { width: 18px; height: 18px; stroke-width: 2.4; }

/* ---------- Hero ---------- */
.hero {
  position: relative; overflow: hidden; color: #FFFFFF; border-radius: 28px; padding: 26px 24px 22px;
  background:
    radial-gradient(70% 90% at 100% 0%, rgba(200,182,226,.36), transparent 62%),
    radial-gradient(60% 70% at 0% 100%, rgba(94,67,150,.5), transparent 60%),
    #241934;
  border: 1px solid rgba(200,182,226,.16);
}
.hero > :not(.hero-mark) { position: relative; }
.hero-mark { position: absolute; right: -44px; bottom: -58px; width: 236px; height: 236px; opacity: .06; pointer-events: none; }
.hero .lbl { font-size: 15px; font-weight: 500; color: rgba(245,245,247,.72); }
.hero .big { font-size: clamp(40px, 11vw, 64px); line-height: 1.05; font-weight: 700; letter-spacing: -.04em; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
.hero .big.neg { color: #ff8a80; }
.hero .barwrap { margin: 16px 0 6px; height: 6px; border-radius: 99px; background: rgba(255,255,255,.16); overflow: hidden; }
.hero .barwrap i { display: block; height: 100%; border-radius: 99px; background: var(--lav); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.hero .barcap { font-size: 13px; color: rgba(245,245,247,.72); }
.hero .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.14); }
.hero .stat small { display: block; font-size: 12px; color: rgba(245,245,247,.66); line-height: 1.25; }
.hero .stat b { display: block; font-size: clamp(13px, 3.7vw, 15px); overflow-wrap: anywhere; font-weight: 600; margin-top: 3px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.hero .actions { display: flex; gap: 10px; margin-top: 20px; }
.hero .actions .btn { padding: 0 16px; font-size: 15px; flex: 1 1 auto; }
.hero .stats { align-items: start; }
.btn { height: 44px; padding: 0 20px; border-radius: 999px; font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, transform .15s; }
.btn:active { transform: scale(.97); }
.btn.light { background: #FFFFFF; color: #241934; }
.btn.light:hover { background: #EFEAF8; }
.btn.ghost { background: rgba(255,255,255,.16); color: #f5f5f7; }
.btn.ghost:hover { background: rgba(255,255,255,.24); }
.btn.primary { background: var(--action); color: var(--on-action); }
.btn.primary:hover { background: var(--action-hover); }
.btn.plain { background: var(--fill); color: var(--text); }
.btn.danger { background: var(--fill); color: var(--bad); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn svg.i { width: 18px; height: 18px; stroke-width: 2.2; }

.notice { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding: 14px 16px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); font-size: 15px; }
.notice p { flex: 1; color: var(--text2); }
.notice b { color: var(--text); font-weight: 600; }
.link { color: var(--link); font-weight: 500; }
.link:hover { text-decoration: underline; }

/* ---------- Envelope cards ---------- */
.envs { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.env {
  text-align: left; background: var(--card); border-radius: 22px; padding: 18px 18px 16px; box-shadow: var(--shadow);
  display: block; width: 100%; transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s;
}
@media (hover: hover) { .env:hover { transform: translateY(-2px); } }
.env:active { transform: scale(.97); }
.env.minus { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bad) 45%, transparent), var(--shadow); }
.row:active { background: var(--fill-strong); }
.env-top { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; min-width: 0; }
.env-top .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.env-bal { font-size: 28px; font-weight: 700; letter-spacing: -.035em; line-height: 1.15; margin: 12px 0 14px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.env-bal.neg { color: var(--bad); }
.bar { height: 6px; border-radius: 99px; background: var(--fill); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .5s cubic-bezier(.2,.8,.2,1), background .3s; }
.bar.warn i { background: var(--warn); }
/* Sheet detail amplop */
.es-note { font-size: 15px; color: var(--text2); margin: 2px 4px 0; }
.es-card { background: var(--sheet-card); border-radius: 20px; padding: 18px; margin: 14px 0 0; }
.es-card .env-bal { font-size: 34px; margin: 0 0 12px; }
.es-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.es-grid div { background: var(--sheet-card); border-radius: 16px; padding: 12px 14px; }
.es-grid small { display: block; font-size: 13px; color: var(--text2); }
.es-grid b { display: block; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; overflow-wrap: anywhere; }
.es-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
.sheet .es-actions .btn.btn { height: 50px; width: 100%; margin: 0; }
.sheet .btn.second { background: var(--sheet-card); color: var(--accent); }
.sheet-title { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; }
.sheet-ic { width: 20px; height: 20px; flex: none; color: var(--c); position: relative; top: -1px; }
.sheet-title span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sec-lbl { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; color: var(--text2); margin: 22px 4px 8px; }
/* Quick-Tap Chips */
.qchips { display: flex; flex-wrap: wrap; gap: 8px; }
.qchip {
  min-height: 44px; max-width: 100%; padding: 0 16px; border-radius: 999px; background: var(--sheet-card);
  box-shadow: inset 0 0 0 1px var(--line); font-size: 15px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; transition: transform .2s var(--spring);
}
.qchip:active { transform: scale(.95); transition-duration: 0s; }
.qchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qchip b { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.qchip svg.i { width: 16px; height: 16px; stroke-width: 2.4; color: var(--accent); }
.qwrap { margin: -4px 0 18px; }
.qwrap[hidden] { display: none; }
.qwrap .sec-lbl { margin-top: 0; }

/* ---------- Lists ---------- */
.summary { background: var(--card); border-radius: 22px; padding: 18px 20px; box-shadow: var(--shadow); }
.summary small { color: var(--text2); font-size: 14px; }
.summary .v { font-size: clamp(26px, 8vw, 34px); overflow-wrap: anywhere; font-weight: 700; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.summary .v.neg { color: var(--bad); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 4px; margin: 0 calc(-1 * var(--pr)) 0 calc(-1 * var(--pl)); padding-inline: var(--pl) var(--pr); scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 14px; border-radius: 999px; background: var(--fill); font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; }
.chip[aria-checked="true"], .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.chip .dot { width: 8px; height: 8px; }
.date-h { margin: 22px 4px 8px; font-size: 13px; font-weight: 600; color: var(--text2); display: flex; justify-content: space-between; gap: 12px; }
.date-h span:first-child { text-transform: uppercase; letter-spacing: .02em; }
.date-h span:last-child { font-variant-numeric: tabular-nums; }
.group { background: var(--card); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
.row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 60px; text-align: left; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 64px; right: 0; border-top: 1px solid var(--line); }
.row:hover { background: var(--fill); }
.av { width: 36px; height: 36px; border-radius: 10px; background: var(--c); color: var(--on-c); font-size: 14px; font-weight: 700; display: grid; place-items: center; flex: none; letter-spacing: 0; }
.row-main { flex: 1; min-width: 0; }
.row-title { display: block; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { display: block; font-size: 13px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub .neg { color: var(--bad); font-weight: 600; }
.row-end { display: flex; flex-direction: column; align-items: flex-end; flex: none; max-width: 48%; }
.row-end .row-sub { max-width: 100%; }
.row-amt { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row-amt.in { color: var(--good); }
.empty { text-align: center; padding: 56px 24px; color: var(--text2); }
.empty-ic { display: block; width: 44px; height: 44px; margin: 0 auto 14px; color: var(--text2); opacity: .45; }
.empty h3 { color: var(--text); font-size: 21px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 6px; }
.empty .btn { margin-top: 18px; }

/* ---------- Settings ---------- */
.set-sec { margin-top: 28px; }
.set-sec > h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; color: var(--text2); margin: 0 4px 8px; }
.set-sec > p.foot { font-size: 13px; color: var(--text2); margin: 8px 4px 0; line-height: 1.4; }
.field { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 16px; position: relative; }
.field + .field::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--line); }
.field > span { flex: none; width: 104px; }
.field input { flex: 1; min-width: 0; height: 40px; border: 0; background: none; outline: 0; font-size: 17px; text-align: right; }
.field input::placeholder { color: var(--text2); opacity: .7; }
.field input:focus-visible { outline: 0; box-shadow: none; }
.field:focus-within { background: var(--fill); }
.field.stack { flex-direction: column; align-items: stretch; gap: 0; padding-block: 10px; }
.field.stack > span { width: auto; font-size: 13px; color: var(--text2); }
.field.stack input { text-align: left; height: 32px; }
.btn-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.seg { display: flex; background: var(--fill); border-radius: 10px; padding: 2px; }
.seg button { flex: 1; height: 32px; border-radius: 8px; font-size: 14px; font-weight: 500; }
.seg button[aria-checked="true"] { background: var(--seg-on); box-shadow: 0 1px 4px rgba(0,0,0,.18); font-weight: 600; }
.status-line { display: flex; align-items: center; gap: 8px; padding: 14px 16px; font-size: 15px; }
.status-line i { width: 10px; height: 10px; border-radius: 50%; background: var(--text2); flex: none; }
.status-line[data-s="ok"] i { background: var(--good); } .status-line[data-s="error"] i { background: var(--bad); } .status-line[data-s="pending"] i { background: var(--warn); }
.status-line span { color: var(--text2); font-size: 13px; margin-left: auto; text-align: right; }

/* ---------- Sheet / dialog ---------- */
.backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(36,25,52,.46); opacity: 0; transition: opacity .25s; }
.backdrop.open { opacity: 1; }
.sheet {
  position: fixed; z-index: 51; left: 0; right: 0; bottom: 0; max-height: 94dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--sheet); border-radius: 24px 24px 0 0; padding: 0 var(--pr) calc(24px + var(--safe-b)) var(--pl);
  transform: translateY(100%); transition: transform .38s cubic-bezier(.2,.9,.25,1);
}
.sheet.open { transform: translateY(0); }
.sheet::before { content: ""; display: block; width: 36px; height: 5px; border-radius: 3px; background: var(--fill-strong); margin: 8px auto 0; }
.sheet .group { background: var(--sheet-card); box-shadow: none; }
.sheet .field:focus-within { background: var(--fill); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; min-height: 52px; gap: 12px; }
.sheet-head h2 { font-size: 17px; font-weight: 600; text-align: center; flex: 1; }
.sheet-head button { font-size: 17px; color: var(--link); min-width: 64px; min-height: 44px; }
.sheet-head button:first-child { text-align: left; }
.sheet-head button:last-child { text-align: right; font-weight: 600; }
.sheet-head button[disabled] { opacity: .35; pointer-events: none; }
.amount-wrap { display: flex; align-items: baseline; justify-content: center; gap: 8px; padding: 10px 0 2px; }
.amount-wrap .cur { font-size: 22px; font-weight: 600; color: var(--text2); }
.amount-wrap input { width: 1ch; min-width: 1ch; max-width: 100%; padding: 0; border: 0; background: none; outline: 0; text-align: center; font-size: 48px; font-weight: 700; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.amount-wrap .amt-m { position: absolute; left: -9999px; top: 0; visibility: hidden; white-space: pre; pointer-events: none; }
.amount-wrap input::placeholder { color: var(--text-muted); opacity: .6; }
.amount-wrap input:focus-visible { outline: 0; box-shadow: none; }
.amount-wrap input { caret-color: var(--accent); }
.hint { text-align: center; font-size: 14px; color: var(--text2); min-height: 22px; margin-bottom: 14px; }
.hint b { color: var(--text); font-weight: 600; } .hint .neg { color: var(--bad); font-weight: 600; }
.lbl2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; color: var(--text2); margin: 4px 4px 8px; }
.chipgrid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.chipgrid .chip { background: var(--sheet-card); height: auto; min-height: 40px; padding: 8px 16px; max-width: 100%; text-align: left; overflow-wrap: anywhere; }
.chipgrid .chip[aria-checked="true"] { background: var(--action); color: var(--on-action); }
.sheet .btn.danger { width: 100%; margin-top: 18px; background: var(--sheet-card); }
.sheet .btn.primary { width: 100%; margin-top: 18px; height: 50px; }
.sheet .btn-row .btn { width: auto; flex: 1 1 auto; margin-top: 0; height: 44px; }
.sheet .btn-row .btn.plain { background: var(--sheet-card); }
@media (min-width: 700px) {
  .sheet { left: 50%; top: 50%; bottom: auto; right: auto; width: 480px; border-radius: 24px; padding-bottom: 24px; transform: translate(-50%, -46%) scale(.97); opacity: 0; transition: transform .3s cubic-bezier(.2,.9,.25,1), opacity .2s; }
  .sheet.open { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .sheet::before { display: none; }
  .sheet-head { padding-top: 8px; }
}
.dialog { text-align: center; padding-top: 22px; }
.dialog h2 { font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.dialog p { color: var(--text2); font-size: 15px; margin-top: 6px; }
.dialog .btns { display: grid; gap: 8px; margin-top: 20px; }
.dialog .btn { height: 48px; width: 100%; }

.toast {
  position: fixed; left: 50%; bottom: calc(92px + var(--safe-b)); z-index: 70; transform: translate(-50%, 20px);
  display: flex; align-items: center; gap: 14px; min-height: 44px;
  background: rgba(36,25,52,.95); color: #FFFFFF; padding: 0 20px; border-radius: 999px; font-size: 15px; font-weight: 500;
  max-width: calc(100vw - 32px); width: max-content; opacity: 0; pointer-events: none; transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.25,1);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.act { padding-right: 6px; }
.toast.act.show { pointer-events: auto; }
.toast .tm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.toast button { flex: none; height: 34px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,.14); color: #C8B6E2; font-weight: 600; }
.toast button:hover { background: rgba(255,255,255,.22); }

/* ---------- Peta (mind map) ---------- */
.mm { position: relative; display: flex; flex-direction: column; gap: 22px; padding: 6px 0 10px; }
.mm-lines { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 0; }
.mm-lines path { fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.mm-lines path.k { opacity: .6; }
.mm-lines path.grow { stroke-dasharray: 1; stroke-dashoffset: 1; animation: mmDraw .55s cubic-bezier(.3,.8,.3,1) forwards; }
.mm-lines path.dash { stroke-dasharray: 3 6; opacity: .55; }
@keyframes mmDraw { to { stroke-dashoffset: 0; } }
.mm-side { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding-left: 32px; }
.mm-h { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; color: var(--text2); }
.mm-h b { color: var(--text); text-transform: none; letter-spacing: -.01em; margin-left: 4px; font-variant-numeric: tabular-nums; }
.mm-branch { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; max-width: 100%; }
.mm-kids { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding-left: 32px; max-width: 100%; }
.mm-node {
  position: relative; z-index: 1; display: inline-flex; flex-direction: column; align-items: flex-start; gap: 1px;
  max-width: 100%; min-width: 0; padding: 9px 14px; border-radius: 16px; text-align: left;
  background: var(--card); box-shadow: var(--shadow);
  transition: transform .35s var(--spring), box-shadow .25s;
}
.mm-node:active { transform: scale(.95); }
.mm-node.cat { min-width: 176px; padding-right: 38px; border-radius: 18px; }
.mm-node.cat .mm-t { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.mm-node .dot { width: 9px; height: 9px; }
.mm-t { display: block; max-width: 100%; font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mm-t em { font-style: normal; font-size: 13px; font-weight: 500; color: var(--text2); }
.mm-v { font-size: 13px; color: var(--text2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mm-chev { position: absolute; top: 50%; right: 12px; width: 16px; height: 16px; margin-top: -8px; color: var(--text2); stroke-width: 2.4; transition: transform .4s var(--spring); }
.mm-branch.open > .cat { box-shadow: 0 0 0 2px var(--c), var(--shadow); }
.mm-branch.open > .cat .mm-chev { transform: rotate(90deg); }
.mm-node.leaf { padding: 7px 12px; border-radius: 13px; }
.mm-node.more { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.mm-node.new { animation: mmIn .4s ease both; }
@keyframes mmIn { from { opacity: 0; } }
.mm-none { position: relative; z-index: 1; padding: 10px 14px; border-radius: 14px; font-size: 14px; color: var(--text2); border: 1px dashed var(--fill-strong); }
.mm-center {
  position: relative; z-index: 1; padding: 16px 18px; border-radius: 22px; color: var(--text);
  background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
}
.mm-center small, .mm-center span { display: block; overflow-wrap: anywhere; font-size: 13px; color: var(--text2); }
.mm-center b { display: block; font-size: clamp(22px, 7vw, 30px); overflow-wrap: anywhere; font-weight: 700; letter-spacing: -.035em; line-height: 1.15; margin: 2px 0; font-variant-numeric: tabular-nums; }
.mm-center b.neg { color: var(--bad); }
@media (min-width: 1100px) {
  .mm { display: grid; grid-template-columns: minmax(0, 1fr) 216px minmax(0, 1fr); align-items: center; gap: 0 44px; padding: 16px 0; }
  .mm-side { padding-left: 0; align-self: center; }
  .mm-side.in { align-items: flex-end; }
  .mm-branch { flex-direction: row; align-items: center; gap: 40px; }
  .mm-side.in .mm-branch { flex-direction: row-reverse; }
  .mm-kids { padding-left: 0; }
  .mm-side.in .mm-kids { align-items: flex-end; }
  .mm-node { max-width: 200px; }
  .mm-node.cat { min-width: 0; flex: none; }
  .mm-kids { min-width: 0; }
  .mm-node.leaf { max-width: 170px; }
  .mm-side.in .mm-node { align-items: flex-end; text-align: right; }
  .mm-side.in .mm-node.cat { padding-right: 14px; padding-left: 38px; }
  .mm-side.in .mm-chev { right: auto; left: 12px; transform: rotate(180deg); }
  .mm-branch.open > .cat .mm-chev, .mm-side.in .mm-branch.open > .cat .mm-chev { transform: rotate(0deg); }
  .mm-side.out .mm-branch.open > .cat .mm-chev { transform: rotate(180deg); }
  .mm-center { text-align: center; }
}

/* ---------- Desktop ---------- */
@media (min-width: 700px) {
  .envs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  :root { --px: 24px; }
  .toast { bottom: 32px; }
}
@media (min-width: 900px) {
  .topbar-in { min-height: 68px; }
  .brand { gap: 10px; font-size: 18px; }
  .brand-ic { width: 30px; height: 30px; top: -2.5px; }
  .tb-title { display: none; }
  .topbar.scrolled .tb-lead .brand { opacity: 1; }
  .toolbar { flex-direction: row; align-items: center; justify-content: space-between; }
  .toolbar .seg { align-self: auto; width: 320px; }
  .tabbar {
    --h: 48px; --pad: 4px; top: calc(var(--safe-t) + 10px); bottom: auto; z-index: 40;
    width: min(520px, calc(100vw - 420px));
  }
  .tab { flex-direction: row; gap: 7px; font-size: 14px; }
  .tab svg.i { width: 19px; height: 19px; }
  .tab:hover:not([aria-current="page"]) { color: var(--accent); }
  .main { padding-bottom: 64px; }
  .envs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .hero { padding: 34px 36px 28px; }
  .hero .actions .btn { flex: 0 0 auto; padding: 0 22px; font-size: 16px; }
  .hero .stat b { font-size: 21px; }
}
/* Area sentuh minimal 44px tanpa mengubah ukuran visual */
.pill, .icon-btn, .monthnav button { position: relative; }
.pill::after, .icon-btn::after, .monthnav button::after { content: ""; position: absolute; inset: -6px; }
.monthnav button.ml::after { inset: -6px 0; }
@media (prefers-reduced-motion: reduce) {
  .brand-ic.bump .bt { animation: none; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<body>
<noscript><p style="padding:24px">Aplikasi ini membutuhkan JavaScript.</p></noscript>
<svg class="sr" aria-hidden="true" focusable="false">
  <filter id="lg-filter" x="0" y="0" width="100%" height="100%" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feImage id="lg-map" x="0" y="0" width="440" height="64" preserveAspectRatio="none" result="map"/>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="20" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="6" result="b"/>
    <feColorMatrix in="b" type="saturate" values="1.9"/>
  </filter>
</svg>
<div class="shell">
  <div>

function applyLocal(op) {
  const listOf = (k) => (k === 'topup' ? S.topups : S.expenses);
  switch (op.t) {
    case 'add': case 'upd': {
      const list = listOf(op.k); const i = list.findIndex((x) => x.id === op.row.id);
      if (i >= 0) list[i] = { ...op.row }; else list.push({ ...op.row });
      break;
    }
    case 'del': { const list = listOf(op.k); const i = list.findIndex((x) => x.id === op.id); if (i >= 0) list.splice(i, 1); break; }
    case 'catAdd':
      if (!S.cats.some((c) => c.name.toLowerCase() === op.name.toLowerCase())) S.cats.push({ name: op.name, note: op.note || '' });
      break;

      const c = S.cats.find((x) => x.name === op.from);

      if (S.lastCat === op.from) S.lastCat = op.name;

let syncing = false, syncTimer = 0;
const setSync = (state, msg = '') => { ui.sync = { state, msg }; renderChrome(); refreshSyncSheet(); };

async function api(body) {
  const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 30000);
  try {
    const r = await fetch(S.cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: S.cfg.token, ...body }), signal: ctrl.signal });

  } finally { clearTimeout(to); }
}

async function sync() {

}

/* =====================================================================

const colorOf = (name) => { const i = S.cats.findIndex((c) => c.name === name); return i < 0 ? '#8e8e93' : (isDark ? PAL_D : PAL_L)[i % 10]; };
function compute(month) {
  const names = S.cats.map((c) => c.name);
  [...S.topups, ...S.expenses].forEach((t) => { if (!names.includes(t.category)) names.push(t.category); });
  const rows = names.map((name) => {
    const cat = S.cats.find((c) => c.name === name);
    const topup = sum(S.topups.filter((t) => t.category === name));
    const ex = S.expenses.filter((t) => t.category === name);
    const spent = sum(ex), spentMonth = sum(ex.filter((t) => t.date.startsWith(month)));
    const saldo = topup - spent;
    return { name, note: cat ? cat.note : 'Tidak ada di daftar Kategori', color: colorOf(name), topup, spent, spentMonth, saldo, pct: topup > 0 ? Math.max(0, Math.min(1, saldo / topup)) : 0 };
  });
  const T = rows.reduce((a, r) => ({ topup: a.topup + r.topup, spent: a.spent + r.spent, spentMonth: a.spentMonth + r.spentMonth, saldo: a.saldo + r.saldo }), { topup: 0, spent: 0, spentMonth: 0, saldo: 0 });
  T.pct = T.topup > 0 ? Math.max(0, Math.min(1, T.saldo / T.topup)) : 0;
  return { rows, T };
}
function runningBalances() {
  const map = {}, cum = {};
  S.expenses.map((e, i) => ({ e, i })).sort((a, b) => (a.e.date < b.e.date ? -1 : a.e.date > b.e.date ? 1 : a.i - b.i)).forEach(({ e }) => {

}

/* ---------- Liquid Glass tab bar ---------- */
const bar = $('#tabbar'), lens = $('#lens');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
const tabEls = () => [...bar.querySelectorAll('.tab')];
let lensIdx = -1, drag = null;

function lensTo(i, mode) {
  const t = tabEls()[i]; if (!t) return;
  const x = t.offsetLeft, w = t.offsetWidth;
  const from = parseFloat(lens.style.getPropertyValue('--lx'));
  lens.style.width = w + 'px';
  if (mode === 'liquid' && !reduceMotion.matches && lens.animate && isFinite(from) && Math.abs(from - x) > 1) {
    lens.style.transition = 'none';
    lens.style.setProperty('--lx', x + 'px');
    const a = lens.animate([
      { transform: `translateX(${from}px) scale(1)` },
      { transform: `translateX(${(from + x) / 2}px) scale(1.24, .8)`, offset: .42 },
      { transform: `translateX(${x}px) scale(1)` }
    ], { duration: 560, easing: 'cubic-bezier(.3,1.25,.5,1)' });
    a.onfinish = a.oncancel = () => { lens.style.transition = ''; };
  } else if (mode === 'jump' || reduceMotion.matches) {
    lens.style.transition = 'none';
    lens.style.setProperty('--lx', x + 'px');
    void lens.offsetWidth; lens.style.transition = '';
  } else {
    lens.style.setProperty('--lx', x + 'px'); // pegas CSS
  }
  lensIdx = i;
}

function lensFollow(clientX) {
  const tabs = tabEls(), host = $('#tabs').getBoundingClientRect();
  const w = lens.offsetWidth, max = host.width - w;
  let x = clientX - host.left - w / 2;
  if (x < 0) x *= .28; else if (x > max) x = max + (x - max) * .28; // tarikan karet di ujung
  lens.style.setProperty('--lx', x + 'px');
  const c = x + w / 2;
  let hot = 0, best = Infinity;
  tabs.forEach((t, i) => { const d = Math.abs(c - (t.offsetLeft + t.offsetWidth / 2)); if (d < best) { best = d; hot = i; } });
  tabs.forEach((t, i) => t.classList.toggle('hot', i === hot && bar.classList.contains('drag')));
  return hot;
}

bar.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || openState) return;
  drag = { id: e.pointerId, x0: e.clientX, moved: false, hot: lensIdx };
  try { bar.setPointerCapture(e.pointerId); } catch (err) { /* abaikan */ }
  bar.classList.add('press');
  drag.hot = lensFollow(e.clientX);
});
bar.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moved && Math.abs(e.clientX - drag.x0) > 6) { drag.moved = true; bar.classList.add('drag'); }
  drag.hot = lensFollow(e.clientX);
});
function endDrag(e, commit) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  const target = commit ? drag.hot : lensIdx;
  drag = null;
  bar.classList.remove('press', 'drag');
  tabEls().forEach((t) => t.classList.remove('hot'));
  lensTo(target);
  if (commit && TABS[target] && TABS[target].id !== ui.tab) go(TABS[target].id);
}
bar.addEventListener('pointerup', (e) => endDrag(e, true));
bar.addEventListener('pointercancel', (e) => endDrag(e, false));
bar.addEventListener('lostpointercapture', (e) => endDrag(e, false));

// Refraksi tepi kaca (Chromium: Edge/Chrome di Windows). Safari tetap memakai blur biasa.
(function setupRefraction() {
  const ua = navigator.userAgent;
  const chromium = /Chrome\//.test(ua) && !/CriOS|FxiOS|EdgiOS|iPhone|iPad|iPod/.test(ua); // Safari tidak mendukung url() di backdrop-filter
  if (!chromium || matchMedia('(prefers-reduced-transparency: reduce)').matches) return;
  const fe = $('#lg-map');
  const draw = () => {
    const w = Math.round(bar.offsetWidth), h = Math.round(bar.offsetHeight);
    if (!w || !h) return;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'), img = ctx.createImageData(w, h), r = h / 2, edge = Math.min(12, r * .5);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const cx = Math.min(Math.max(x + .5, r), w - r), dx = x + .5 - cx, dy = y + .5 - r;
      const dist = Math.hypot(dx, dy), inside = r - dist;
      const k = inside > 0 && inside < edge ? Math.pow(1 - inside / edge, 2) : 0;
      const nx = dist ? dx / dist : 0, ny = dist ? dy / dist : 0, o = (y * w + x) * 4;
      img.data[o] = 128 - nx * k * 127; img.data[o + 1] = 128 - ny * k * 127; img.data[o + 2] = 128; img.data[o + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    fe.setAttribute('href', c.toDataURL()); fe.setAttribute('width', w); fe.setAttribute('height', h);
  };
  let raf = 0;
  if (window.ResizeObserver) new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }).observe(bar);
  draw();
  bar.classList.add('refract');
})();

/* ---------- Quick-Tap Chips ---------- */
function getQuickChips(category, kind) {
  const since = dstr(new Date(Date.now() - 60 * 864e5));
  const g = new Map();
  (kind === 'topup' ? S.topups : S.expenses).forEach((t) => {
    if (t.category !== category || !(t.date >= since)) return;
    const n = String(t.note || '').trim();
    if (!n || n === '-') return;
    const k = n.toLowerCase() + '|' + t.amount;
    const x = g.get(k);
    if (!x) g.set(k, { note: n, amount: t.amount, n: 1, last: t.date });
    else { x.n++; if (t.date >= x.last) { x.last = t.date; x.note = n; } }
  });
  return [...g.values()].sort((a, b) => b.n - a.n || (a.last < b.last ? 1 : a.last > b.last ? -1 : 0)).slice(0, 4);
}
const chipsHtml = (cat, kind) => getQuickChips(cat, kind).map((c) =>
  `<button type="button" class="qchip" data-act="quick" data-kind="${kind}" data-cat="${esc(cat)}" data-note="${esc(c.note)}" data-amount="${c.amount}" aria-label="Catat ${esc(c.note)} ${fmt(c.amount)}">${svg('bolt')}<span>${esc(c.note)}</span><b>· ${fmt(c.amount)}</b></button>`).join('');

function quickLog(kind, category, note, amount) {
  const row = { id: uid(), date: today(), category, amount: Number(amount), note };
  S.lastCat = category;
  closeSheet();
  mutate({ t: 'add', k: kind, row });
  if (kind === 'topup') bumpBrand();
  toast('Dicatat: ' + note + ' · ' + fmt(row.amount), {
    undo: () => { mutate({ t: 'del', k: kind, id: row.id }); toast('Dibatalkan'); }
  });
}

function viewHistory() {
  const type = ui.histType, f = ui.filter.history;
  const pick = (kind) => (type === 'all' || type === kind ? (kind === 'topup' ? S.topups : S.expenses) : [])
    .map((t, i) => ({ t, i, kind })).filter(({ t }) => t.date.startsWith(ui.month) && (!f || t.category === f));
  const items = [...pick('expense'), ...pick('topup')];
  items.sort((a, b) => (a.t.date < b.t.date ? 1 : a.t.date > b.t.date ? -1 : a.kind !== b.kind ? (a.kind === 'topup' ? 1 : -1) : b.i - a.i));
  const sIn = sum(items.filter((x) => x.kind === 'topup').map((x) => x.t));
  const sOut = sum(items.filter((x) => x.kind === 'expense').map((x) => x.t));
  const signed = (v) => (v > 0 ? '+' : '') + fmt(v);

  const sumVal = type === 'all' ? signed(sIn - sOut) : fmt(type === 'expense' ? sOut : sIn);

  const groups = [];
  items.forEach((x) => { const g = groups[groups.length - 1]; if (g && g.date === x.t.date) g.items.push(x); else groups.push({ date: x.t.date, items: [x] }); });
  const gTotal = (g) => { const i = sum(g.items.filter((x) => x.kind === 'topup').map((x) => x.t)), o = sum(g.items.filter((x) => x.kind === 'expense').map((x) => x.t)); return type === 'all' ? signed(i - o) : fmt(i + o); };

        <span class="row-end"><span class="row-amt ${isExp ? '' : 'in'}">${isExp ? '−' : '+'}${fmt(t.amount)}</span>${sisa}</span></button>`;

/* ---------- Peta: model ---------- */
let mmGroups = {};
const noteKey = (n) => { const v = String(n || '').trim(); return v && v !== '-' ? v.toLowerCase().replace(/\s+/g, ' ') : ''; };
const pctTxt = (x) => (x > 0 && x < .005 ? '<1%' : Math.round(x * 100) + '%');
const lineW = (share) => (1.25 + 6 * Math.max(0, Math.min(1, share))).toFixed(2);

function mapSide(list, kind) {
  const total = sum(list);
  const byCat = new Map();
  list.forEach((t) => { if (!byCat.has(t.category)) byCat.set(t.category, []); byCat.get(t.category).push(t); });
  const cats = [...byCat].map(([name, items]) => {
    const amount = sum(items);
    const g = new Map();
    items.forEach((t) => {
      const k = noteKey(t.note);
      if (!g.has(k)) g.set(k, { key: k, label: k ? String(t.note).trim() : 'Tanpa keterangan', items: [] });
      g.get(k).items.push(t);
    });
    const groups = [...g.values()].map((x) => ({ ...x, amount: sum(x.items) }))
      .sort((a, b) => b.amount - a.amount || a.label.localeCompare(b.label));
    return { name, amount, share: total ? amount / total : 0, groups };
  }).sort((a, b) => b.amount - a.amount || a.name.localeCompare(b.name));
  return { kind, total, cats };
}

function mapSideHtml(s, dir) {
  const title = dir === 'in' ? 'Masuk' : 'Keluar';
  if (!s.cats.length) {
    return `<div class="mm-side ${dir}"><div class="mm-h">${title}</div>
      <div class="mm-none" id="mm-${dir}-none" data-p="mm-c" data-w="1.5" data-c="#8e8e93" data-dash="1">Belum ada ${dir === 'in' ? 'top up' : 'pengeluaran'} bulan ini</div></div>`;
  }
  const cats = s.cats.map((c, i) => {
    const key = dir + '|' + c.name, moreKey = key + '|more';
    const open = ui.mmOpen.has(key), all = ui.mmOpen.has(moreKey);
    const isNew = !!ui.mmJust && ui.mmJust.startsWith(key);
    const id = `mm-${dir}-${i}`, col = colorOf(c.name);
    let kids = '';
    if (open) {
      const shown = all || c.groups.length <= 6 ? c.groups : c.groups.slice(0, 5);
      const rest = c.groups.slice(shown.length);
      kids = shown.map((g, j) => {
        const gk = key + '|' + g.key;
        mmGroups[gk] = { kind: s.kind, cat: c.name, label: g.label, ids: g.items.map((t) => t.id) };
        const share = c.amount ? g.amount / c.amount : 0;
        return `<button class="mm-node leaf${isNew ? ' new' : ''}" id="${id}-${j}" data-p="${id}" data-w="${lineW(share)}" data-c="${col}" data-act="mmleaf" data-g="${esc(gk)}" style="--c:${col}">
          <span class="mm-t">${esc(g.label)}${g.items.length > 1 ? ` <em>${g.items.length}×</em>` : ''}</span>
          <span class="mm-v">${fmt(g.amount)} · ${pctTxt(share)}</span></button>`;
      }).join('');
      if (rest.length) {
        const ra = sum(rest.flatMap((g) => g.items));
        kids += `<button class="mm-node more${isNew ? ' new' : ''}" id="${id}-more" data-p="${id}" data-w="1.25" data-c="${col}" data-act="mmtoggle" data-k="${esc(moreKey)}" style="--c:${col}">
          <span class="mm-t">Lainnya <em>${rest.length}</em></span><span class="mm-v">${fmt(ra)} · ${pctTxt(c.amount ? ra / c.amount : 0)}</span></button>`;
      } else if (all && c.groups.length > 6) {
        kids += `<button class="mm-node more" id="${id}-less" data-act="mmtoggle" data-k="${esc(moreKey)}"><span class="mm-t">Ringkas</span></button>`;
      }
    }
    return `<div class="mm-branch${open ? ' open' : ''}">
      <button class="mm-node cat" id="${id}" data-p="mm-c" data-w="${lineW(c.share)}" data-c="${col}" data-act="mmtoggle" data-k="${esc(key)}" aria-expanded="${open}" style="--c:${col}">
        <span class="mm-t"><i class="dot"></i>${esc(c.name)}</span>
        <span class="mm-v">${fmt(c.amount)} · ${pctTxt(c.share)}</span>
        <svg class="i mm-chev" viewBox="0 0 24 24" aria-hidden="true">${IC.right}</svg>
      </button>
      ${kids ? `<div class="mm-kids">${kids}</div>` : ''}
    </div>`;
  }).join('');
  return `<div class="mm-side ${dir}"><div class="mm-h">${title}<b>${fmt(s.total)}</b></div>${cats}</div>`;
}

function viewMap() {
  const m = ui.month;
  mmGroups = {};
  const ins = mapSide(S.topups.filter((t) => t.date.startsWith(m)), 'topup');
  const outs = mapSide(S.expenses.filter((t) => t.date.startsWith(m)), 'expense');
  const head = `<div class="toolbar">${monthNav()}</div>`;
  if (!ins.cats.length && !outs.cats.length) return head + emptyBlock('Belum ada aliran', esc(monthLabel(m)), 'Catat', 'new', 'expense');
  const net = ins.total - outs.total;
  return head + `<div class="mm" id="mm"><svg class="mm-lines" id="mm-lines" aria-hidden="true"></svg>
    ${mapSideHtml(ins, 'in')}
    <div class="mm-center" id="mm-c"><small>Selisih ${esc(monthLabel(m))}</small><b class="${net < 0 ? 'neg' : ''}">${net > 0 ? '+' : ''}${fmt(net)}</b><span>Masuk ${fmt(ins.total)} · Keluar ${fmt(outs.total)}</span></div>
    ${mapSideHtml(outs, 'out')}
  </div>`;
}

/* ---------- Peta: garis penghubung ---------- */
function drawMap(animate) {
  const box = $('#mm'), lines = $('#mm-lines');
  if (!box || !lines) return;
  const B = box.getBoundingClientRect();
  const W = Math.ceil(box.scrollWidth), H = Math.ceil(box.scrollHeight);
  lines.setAttribute('width', W); lines.setAttribute('height', H); lines.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const horiz = matchMedia('(min-width: 1100px)').matches;
  const rect = (el) => { const r = el.getBoundingClientRect(); return { l: r.left - B.left, r: r.right - B.left, t: r.top - B.top, b: r.bottom - B.top, cy: (r.top + r.bottom) / 2 - B.top }; };
  const out = [];
  box.querySelectorAll('[data-p]').forEach((el) => {
    const par = document.getElementById(el.dataset.p);
    if (!par) return;
    const a = rect(par), b = rect(el);
    const dir = el.closest('.mm-side').classList.contains('in') ? 'in' : 'out';
    let d;
    if (horiz) {
      const x0 = dir === 'out' ? a.r : a.l, x1 = dir === 'out' ? b.l : b.r, mx = (x0 + x1) / 2;
      d = `M${x0} ${a.cy}C${mx} ${a.cy} ${mx} ${b.cy} ${x1} ${b.cy}`;
    } else {
      const up = b.cy < a.cy, x0 = a.l + 16, y0 = up ? a.t : a.b, x1 = b.l, y1 = b.cy;
      const r = Math.max(0, Math.min(12, Math.abs(y1 - y0) / 2, (x1 - x0) / 2)), sgn = up ? -1 : 1;
      d = `M${x0} ${y0}V${y1 - sgn * r}Q${x0} ${y1} ${x0 + r} ${y1}H${x1}`;
    }
    const cls = [el.dataset.p === 'mm-c' ? '' : 'k', animate && el.classList.contains('new') ? 'grow' : '', el.dataset.dash ? 'dash' : ''].join(' ').trim();
    const w = horiz ? el.dataset.w : (el.dataset.w * .75).toFixed(2);
    out.push(`<path d="${d}" class="${cls}" ${cls.includes('grow') ? 'pathLength="1"' : ''} style="stroke:${el.dataset.c};stroke-width:${w}px"/>`);
  });
  lines.innerHTML = out.join('');
}

const URL_OK = /^https:\/\/script\.google(usercontent)?\.com\//i;
const URL_DEV = /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//i;

function keepInputs(url, token) {
  const u = $('#cfg-url'), t = $('#cfg-token');
  if (u) u.value = url; if (t) t.value = token;
}
async function connect(url, token) {
  url = url.trim(); token = token.trim();
  if (!URL_OK.test(url) && !URL_DEV.test(url)) { toast('URL harus dari script.google.com'); return false; }
  if (!token) { toast('Token kosong'); return false; }
  const old = { ...S.cfg };
  S.cfg = { url, token };
  setSync('syncing');
  try {
    const res = await api({ action: 'sync', ops: [] });
    if (!res.ok) { S.cfg = old; setSync(old.url ? 'ok' : 'idle'); keepInputs(url, token); toast(errText(res.error)); return false; }
    const localCount = S.topups.length + S.expenses.length;
    let upload = false;
    if (localCount && !old.url) {
      upload = await confirmDialog({ title: 'Unggah data lokal?', message: `${localCount} catatan ada di perangkat ini. “Pakai data Sheets” menggantinya dengan isi Sheets.`, ok: 'Unggah', cancel: 'Pakai data Sheets' });
      if (upload === null) { S.cfg = old; setSync('idle'); keepInputs(url, token); toast('Dibatalkan'); return false; }
    }
    if (upload) {
      const ops = [];
      S.cats.forEach((c) => ops.push({ t: 'catAdd', name: c.name, note: c.note }));
      S.topups.forEach((row) => ops.push({ t: 'add', k: 'topup', row }));
      S.expenses.forEach((row) => ops.push({ t: 'add', k: 'expense', row }));
      S.queue = ops;
    } else {
      S.queue = [];
      S.cats = res.data.categories; S.topups = res.data.topups; S.expenses = res.data.expenses;
    }
    save(); setSync('idle'); render(); toast('Terhubung');
    sync();
    return true;
  } catch (e) {
    S.cfg = old; setSync(old.url ? 'ok' : 'idle'); keepInputs(url, token);
    toast(e.name === 'AbortError' || e instanceof TypeError ? 'Gagal terhubung. Cek URL & akses "Anyone".' : e.message);
    return false;
  }
}
const b64 = (s) => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64 = (s) => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));

async function importHashConfig() {
  const m = location.hash.match(/^#cfg=(.+)$/);
  if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  await applyCfgCode(m[1]);
}
async function applyCfgCode(code) {
  try {
    const { u, t } = JSON.parse(unb64(code));
    if (!URL_OK.test(u) && !URL_DEV.test(u)) throw new Error('bad');
    const host = new URL(u).host;
    const ok = await confirmDialog({ title: 'Hubungkan?', message: `Ke ${host}. Lanjut hanya jika tautan dari Anda.`, ok: 'Hubungkan' });
    if (ok) { if (await connect(u, t)) go('home'); }
  } catch (e) { toast('Tautan penyiapan tidak valid'); }
}

function exportCsv() {
  const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const qt = (v) => { const t = String(v ?? ''); return q(/^[=+@\t\r]|^-./.test(t) ? "'" + t : t); }; // cegah formula Excel dari teks
  const lines = [['Jenis', 'Tanggal', 'Kategori', 'Keterangan', 'Jumlah'].map(q).join(',')];
  S.topups.forEach((t) => lines.push([q('Top Up'), q(t.date), qt(t.category), qt(t.note), t.amount].join(',')));
  S.expenses.forEach((t) => lines.push([q('Pengeluaran'), q(t.date), qt(t.category), qt(t.note), t.amount].join(',')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'finite-' + today() + '.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function applyTheme() {
  const r = document.documentElement;
  if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme);
  const dark = S.theme === 'dark' || (S.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  const flipped = dark !== isDark; isDark = dark;
  r.classList.toggle('is-dark', dark);
  $('#meta-theme').setAttribute('content', dark ? '#120E19' : '#FAF9FC');
  if (flipped && booted) renderMain(); // warna kategori ikut tema
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

/* =====================================================================
   Start
   ===================================================================== */
buildNav();
applyTheme();
const h = location.hash.match(/^#\/(home|history|map|settings|expense|topup)$/);
if (h) {
  if (h[1] === 'expense' || h[1] === 'topup') { ui.histType = h[1]; ui.tab = 'history'; history.replaceState(null, '', '#/history'); } // tautan lama
  else ui.tab = h[1];
}
render();
booted = true;
importHashConfig().then(() => scheduleSync(50));
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
window.__bs = { S, ui, sync, compute }; // untuk pengujian
})();
</script>
